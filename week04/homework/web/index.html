<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 文档问答系统</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>📄 RAG 文档问答系统</h1>
            <span class="subtitle">上传文档，智能问答</span>
        </header>
        
        <div class="main">
            <!-- 左侧栏 -->
            <aside class="sidebar">
                <div class="section">
                    <h2>📤 上传文档</h2>
                    <div class="upload-area">
                        <input type="file" id="fileInput" accept=".pdf,.md,.txt,.html" hidden>
                        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">选择文件</button>
                        <span id="fileName" class="file-name"></span>
                        <button class="btn btn-success" id="uploadBtn" onclick="uploadFile()" disabled>上传</button>
                    </div>
                    <p class="hint">支持 PDF、Markdown、TXT、HTML</p>
                </div>
                
                <div class="section">
                    <h2>📚 已上传文档</h2>
                    <ul id="docList" class="doc-list"></ul>
                    <p id="docCount" class="doc-count">共 0 份文档</p>
                </div>
                
                <div class="section">
                    <h2>💬 对话列表</h2>
                    <button class="btn btn-primary btn-full" onclick="createConversation()">+ 新建对话</button>
                    <ul id="convList" class="conv-list"></ul>
                </div>
            </aside>
            
            <!-- 右侧内容区 -->
            <main class="content">
                <div id="chatArea" class="chat-area">
                    <div class="welcome">
                        <h2>👋 欢迎使用 RAG 文档问答系统</h2>
                        <p>上传文档后，您可以向 AI 提问关于文档内容的任何问题。</p>
                    </div>
                </div>
                
                <div class="input-area">
                    <div class="input-row">
                        <input type="text" id="questionInput" class="question-input" placeholder="输入问题..." onkeypress="if(event.key==='Enter')sendQuestion()">
                        <button class="btn btn-primary" onclick="sendQuestion()">发送</button>
                    </div>
                    <div class="options">
                        <label class="checkbox">
                            <input type="checkbox" id="streamToggle" checked>
                            <span>流式输出</span>
                        </label>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
